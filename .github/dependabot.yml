version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    day: monday
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    github-actions-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  commit-message:
    prefix: chore(deps)
- package-ecosystem: gradle
  directory: /flutter_app/android
  schedule:
    day: monday
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    gradle-minor-patch-flutter_app-android:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  commit-message:
    prefix: chore(deps)
- package-ecosystem: pub
  directory: /flutter_app
  schedule:
    day: monday
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    pub-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  commit-message:
    prefix: chore(deps)
- package-ecosystem: gradle
  directory: /flutter_app/android/app
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    gradle-minor-patch-flutter_app-android-app:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
